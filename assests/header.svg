<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="250">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#050B18"></stop>
  <stop offset="45%" stop-color="#0B1738"></stop>
  <stop offset="100%" stop-color="#120A2E"></stop>
</linearGradient>

<linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#22D3EE"></stop>
  <stop offset="45%" stop-color="#60A5FA"></stop>
  <stop offset="75%" stop-color="#A855F7"></stop>
  <stop offset="100%" stop-color="#22D3EE"></stop>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
  <feMerge>
    <feMergeNode in="blur"></feMergeNode>
    <feMergeNode in="SourceGraphic"></feMergeNode>
  </feMerge>
</filter>

<pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
  <path d="M35 0H0V35" fill="none" stroke="#38BDF8" stroke-opacity="0.07"></path>
</pattern>

</defs>

<!-- Background -->
<rect width="1000" height="250" rx="18" fill="url(#bg)"></rect>
<rect width="1000" height="250" rx="18" fill="url(#grid)"></rect>

<!-- Ambient glow -->
<circle cx="90" cy="70" r="100" fill="#2563EB" opacity="0.14" filter="url(#glow)"></circle>
<circle cx="900" cy="170" r="120" fill="#7C3AED" opacity="0.13" filter="url(#glow)"></circle>

<!-- Circuit decorations -->
<g fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5">
  <path d="M20 70H150L185 105H240"></path>
  <path d="M980 55H875L835 95H790"></path>
  <path d="M25 190H130L160 160H220"></path>
  <path d="M975 205H875L840 170H785"></path>
</g>

<g fill="#38BDF8">
  <circle cx="150" cy="70" r="3"></circle>
  <circle cx="185" cy="105" r="3"></circle>
  <circle cx="875" cy="55" r="3"></circle>
  <circle cx="835" cy="95" r="3"></circle>
</g>

<!-- Shield -->
<g transform="translate(875,55)" filter="url(#glow)">
  <path d="M45 0L78 12V42C78 65 62 82 45 90C28 82 12 65 12 42V12Z" fill="#0B1738" stroke="url(#neon)" stroke-width="3"></path>
  <path d="M45 22C36 22 31 28 31 37V43H27V58H63V43H59V37C59 28 54 22 45 22Z" fill="#22D3EE" opacity="0.9"></path>
</g>

<!-- Small terminal symbol -->
<g transform="translate(55,155)">
  <rect width="110" height="55" rx="10" fill="#071329" stroke="#2563EB" stroke-opacity="0.6"></rect>
  <text x="18" y="34" fill="#22D3EE" font-family="monospace" font-size="21">&gt;_</text>
</g>

<!-- Status badge -->
<g transform="translate(375,24)">
  <rect width="250" height="28" rx="14" fill="#071329" stroke="#38BDF8" stroke-opacity="0.65"></rect>
  <circle cx="20" cy="14" r="5" fill="#22D3EE"></circle>
  <text x="140" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#BAE6FD">
    BUILDING • LEARNING • SECURING
  </text>
</g>

<!-- Main name -->
<text x="500" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900" letter-spacing="4" fill="url(#neon)" filter="url(#glow)">
  AAMILA FATHIMA M
</text>

<!-- Subtitle -->
<text x="500" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#E2E8F0">
  SOFTWARE DEVELOPER
  <tspan fill="#64748B"> • </tspan>
  FULL-STACK
  <tspan fill="#64748B"> • </tspan>
  AI/ML
  <tspan fill="#64748B"> • </tspan>
  CYBERSECURITY
</text>

<!-- Divider -->
<line x1="300" y1="165" x2="700" y2="165" stroke="url(#neon)" stroke-width="1.5" opacity="0.8"></line>

<polygon points="500,159 506,165 500,171 494,165" fill="#22D3EE" filter="url(#glow)"></polygon>

<!-- Bottom tagline -->
<text x="500" y="199" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#67E8F9">
  BUILDING SECURE &amp; INTELLIGENT APPLICATIONS
</text>

<!-- Corner accents -->
<path d="M15 35V15H35" fill="none" stroke="#A855F7" stroke-width="3"></path>
<path d="M965 15H985V35" fill="none" stroke="#22D3EE" stroke-width="3"></path>
<path d="M15 215V235H35" fill="none" stroke="#22D3EE" stroke-width="3"></path>
<path d="M965 235H985V215" fill="none" stroke="#A855F7" stroke-width="3"></path>

</svg>
